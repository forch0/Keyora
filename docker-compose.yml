services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: zekura-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html:cached
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - zekura
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: zekura-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - zekura
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: zekura-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-zekura}
      POSTGRES_USER: ${DB_USERNAME:-zekura}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - zekura-postgres:/var/lib/postgresql/data
    networks:
      - zekura
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-zekura} -d ${DB_DATABASE:-zekura}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zekura-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - zekura-redis:/data
    networks:
      - zekura
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: Mailpit for local email testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: zekura-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - zekura

networks:
  zekura:
    driver: bridge

volumes:
  zekura-postgres:
  zekura-redis:
